[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-pipeline"
version = "0.1.0"
description = "Phase 1: nạp raw GA4 (BigQuery export) vào ClickHouse, giữ nguyên nested"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.7",
    "google-cloud-bigquery>=3.19",
    "google-cloud-storage>=2.14",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "pyarrow>=16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: cần ClickHouse thật + shared volume (chạy qua `make test`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
